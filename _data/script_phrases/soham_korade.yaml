# Homepage name morph. Outlines from scripts/script_morph/build.py — do not hand-edit paths.
# cells[] are aligned morph slots (So|ha|m| |Ko|ra|de). build.py emits atoms (base|matra) when marks exist.
# Optional compose (attach / cursive) is data-driven after morph.
id: soham_korade
accessible_name: Soham Korade
carousel:
  - latin
  - devanagari
  - sanskrit
  - bengali
  - gurmukhi
  - odia
  - modi
  - telugu
  - kannada
  - tamil
  - malayalam
  - sinhala
  - tibetan
  - katakana
  - urdu

families:
  latin: [latin]
  nagari: [devanagari, sanskrit, bengali, gurmukhi, odia, modi]
  southern: [telugu, kannada, tamil, malayalam, sinhala]
  tibetan: [tibetan]
  katakana: [katakana]
  arabic: [urdu]

scripts:
  - id: latin
    label: Latin
    family: latin
    dir: ltr
    font: noto-sans
    cells: ["So", "ha", "m", " ", "Ko", "ra", "de"]

  - id: devanagari
    label: Devanagari
    family: nagari
    dir: ltr
    font: noto-sans-devanagari
    cells: ["सो", "ह", "म", " ", "को", "र", "डे"]

  - id: sanskrit
    label: Sanskrit
    family: nagari
    dir: ltr
    font: noto-sans-devanagari
    cells: ["सोऽ", "ह", "ं", " ", "को", "र", "डे"]
    compose:
      mode: attach
      steps:
        - slots: [1, 2]
          term: "Anusvāra attachment"

  - id: bengali
    label: Bengali
    family: nagari
    dir: ltr
    font: noto-sans-bengali
    cells: ["সো", "হ", "ম", " ", "কো", "র", "ডে"]

  - id: gurmukhi
    label: Gurmukhi
    family: nagari
    dir: ltr
    font: noto-sans-gurmukhi
    cells: ["ਸੋ", "ਹ", "ਮ", " ", "ਕੋ", "ਰ", "ਡੇ"]

  - id: odia
    label: Odia
    family: nagari
    dir: ltr
    font: noto-sans-oriya
    cells: ["ସୋ", "ହ", "ମ", " ", "କୋ", "ର", "ଡେ"]

  - id: modi
    label: Modi
    family: nagari
    dir: ltr
    font: noto-sans-modi
    cells: ["𑘭𑘻", "𑘮", "𑘦", " ", "𑘎𑘻", "𑘨", "𑘚𑘹"]

  - id: telugu
    label: Telugu
    family: southern
    dir: ltr
    font: noto-sans-telugu
    cells: ["సో", "హ", "ం", " ", "కో", "ర", "డే"]
    compose:
      mode: attach
      steps:
        - slots: [1, 2]
          term: "Anusvāra attachment"

  - id: kannada
    label: Kannada
    family: southern
    dir: ltr
    font: noto-sans-kannada
    cells: ["ಸೋ", "ಹ", "ಂ", " ", "ಕೋ", "ರ", "ಡೆ"]
    compose:
      mode: attach
      steps:
        - slots: [1, 2]
          term: "Anusvāra attachment"

  - id: tamil
    label: Tamil
    family: southern
    dir: ltr
    font: noto-sans-tamil
    cells: ["ஸோ", "ஹ", "ம்", " ", "கோ", "ர", "டே"]
    compose:
      mode: attach
      steps:
        - slots: [1, 2]
          term: "Pulli / coda attachment"

  - id: malayalam
    label: Malayalam
    family: southern
    dir: ltr
    font: noto-sans-malayalam
    cells: ["സോ", "ഹ", "ം", " ", "കോ", "ര", "ഡേ"]
    compose:
      mode: attach
      steps:
        - slots: [1, 2]
          term: "Anusvāra attachment"

  - id: sinhala
    label: Sinhala
    family: southern
    dir: ltr
    font: noto-sans-sinhala
    cells: ["සෝ", "හ", "ම්", " ", "කෝ", "ර", "ඩේ"]
    compose:
      mode: attach
      steps:
        - slots: [1, 2]
          term: "Coda attachment"

  - id: tibetan
    label: Tibetan
    family: tibetan
    dir: ltr
    font: noto-serif-tibetan
    cells: ["སོ", "ཧ", "མ", "་", "ཀོ", "ར", "ཌེ"]

  - id: katakana
    label: Katakana
    family: katakana
    dir: ltr
    font: noto-sans-cjk-jp
    cells: ["ソー", "ハ", "ム", " ", "コー", "ラ", "デー"]

  - id: urdu
    label: Urdu
    family: arabic
    dir: rtl
    font: noto-nastaliq-urdu
    cells: ["سو", "ہَ", "مْ", " ", "کو", "ر", "ڈے"]
    compose:
      mode: cursive
      term: "Cursive joining"
